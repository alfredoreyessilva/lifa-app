name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Todavía no hay tests automatizados (ver roadmap, Fase 3) — mientras
      # tanto, esto al menos revisa que cada archivo del backend tenga
      # sintaxis válida antes de llegar a Render, sin necesitar base de
      # datos ni variables de entorno reales.
      #
      # Cubre src/, scripts/ y tests/, y tanto .js como .mjs: los recorridos
      # de punta a punta y los scripts de diagnóstico son .mjs y antes se
      # quedaban fuera de este chequeo por el patrón del `find`. No los
      # *corre* (eso necesita un backend vivo y una rama de Neon), solo
      # verifica que no tengan un error de sintaxis.
      - name: Verificar sintaxis del backend
        run: find src scripts tests \( -name "*.js" -o -name "*.mjs" \) -print0 | xargs -0 -n1 node --check
